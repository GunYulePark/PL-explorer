name: Ingest uploaded RAW files

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pnl-raw-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SECRET_KEY != '' }}
        with:
          python-version: "3.12"
      - name: Install RAW parser
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SECRET_KEY != '' }}
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Check worker secrets
        if: ${{ secrets.SUPABASE_URL == '' || secrets.SUPABASE_SECRET_KEY == '' }}
        run: echo "::warning::Add SUPABASE_URL and SUPABASE_SECRET_KEY Repository secrets before enabling RAW ingestion."
      - name: Ingest pending RAW batches
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SECRET_KEY != '' }}
        run: python scripts/ingest_raw.py --process-pending --limit 3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
